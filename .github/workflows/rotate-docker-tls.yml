name: Rotate Docker TLS

# Docker TLS is retired. The Railway API now reaches EC2 through the
# authenticated HTTPS terminal agent, so monthly Docker certificate rotation
# is no longer required.

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Docker TLS rotation retired
        run: |
          echo "Docker TLS rotation is retired."
          echo "Use Deploy Infrastructure to update the terminal agent over SSM/HTTPS."
