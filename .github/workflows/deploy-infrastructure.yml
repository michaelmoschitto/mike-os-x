name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-infrastructure.yml'
      - 'iac/**'
      - 'apps/api/terminal.Dockerfile'
      - 'apps/api/Dockerfile.agent'
      - 'apps/api/docker-compose.terminal.yml'
      - 'apps/api/docker-compose.agent.yml'
      - 'apps/api/Caddyfile'
      - 'apps/api/agent/**'
  workflow_dispatch:

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pulumi
        uses: pulumi/actions@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: iac
        run: bun install

      - name: Validate required secrets
        run: |
          MISSING_SECRETS=()

          for secret_name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            PULUMI_PASSPHRASE \
            RAILWAY_TOKEN \
            CORS_ORIGINS \
            ADMIN_API_KEY \
            TERMINAL_AGENT_TOKEN \
            AGENT_HOSTNAME
          do
            case "$secret_name" in
              AWS_ACCESS_KEY_ID) value="${{ secrets.AWS_ACCESS_KEY_ID }}" ;;
              AWS_SECRET_ACCESS_KEY) value="${{ secrets.AWS_SECRET_ACCESS_KEY }}" ;;
              PULUMI_PASSPHRASE) value="${{ secrets.PULUMI_PASSPHRASE }}" ;;
              RAILWAY_TOKEN) value="${{ secrets.RAILWAY_TOKEN }}" ;;
              CORS_ORIGINS) value="${{ secrets.CORS_ORIGINS }}" ;;
              ADMIN_API_KEY) value="${{ secrets.ADMIN_API_KEY }}" ;;
              TERMINAL_AGENT_TOKEN) value="${{ secrets.TERMINAL_AGENT_TOKEN }}" ;;
              AGENT_HOSTNAME) value="${{ secrets.AGENT_HOSTNAME }}" ;;
            esac

            if [ -z "$value" ]; then
              MISSING_SECRETS+=("$secret_name")
            fi
          done

          TOKEN="${{ secrets.TERMINAL_AGENT_TOKEN }}"
          if [ ${#TOKEN} -lt 32 ]; then
            echo "::error::TERMINAL_AGENT_TOKEN must be at least 32 characters"
            exit 1
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${MISSING_SECRETS[*]}"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            exit 1
          fi

          echo "✅ All required secrets are configured"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Set Pulumi passphrase
        run: |
          echo "PULUMI_CONFIG_PASSPHRASE=${{ secrets.PULUMI_PASSPHRASE }}" >> $GITHUB_ENV
          echo "AWS_REGION=us-west-2" >> $GITHUB_ENV

      - name: Create S3 bucket for Pulumi state (if needed)
        run: |
          BUCKET_NAME="mike-os-x-pulumi-state"
          if ! aws s3 ls "s3://$BUCKET_NAME" 2>&1 > /dev/null; then
            echo "Creating S3 bucket for Pulumi state..."
            aws s3 mb "s3://$BUCKET_NAME" --region us-west-2
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            echo "✅ S3 bucket created with versioning enabled"
          else
            echo "✅ S3 bucket already exists"
          fi

      - name: Login to Pulumi (S3 backend)
        run: pulumi login s3://mike-os-x-pulumi-state

      - name: Select or create stack
        working-directory: iac
        run: |
          if ! pulumi stack ls 2>/dev/null | grep -q "default"; then
            pulumi stack init default
          else
            pulumi stack select default
          fi

      - name: Configure agent hostname
        working-directory: iac
        run: pulumi config set agentHostname "${{ secrets.AGENT_HOSTNAME }}"

      - name: Refresh Pulumi state
        working-directory: iac
        run: pulumi refresh --yes --non-interactive

      - name: Preview changes
        working-directory: iac
        run: pulumi preview --non-interactive

      - name: Deploy infrastructure
        working-directory: iac
        run: pulumi up --yes --non-interactive

      - name: Get instance metadata
        id: host
        working-directory: iac
        run: |
          INSTANCE_ID=$(pulumi stack output instanceId --show-secrets)
          EC2_IP=$(pulumi stack output publicIp --show-secrets)
          AGENT_URL=$(pulumi stack output agentUrl --show-secrets)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2_IP=$EC2_IP" >> "$GITHUB_OUTPUT"
          echo "AGENT_URL=$AGENT_URL" >> "$GITHUB_OUTPUT"
          echo "Instance: $INSTANCE_ID ($EC2_IP)"

      - name: Wait for SSM agent
        env:
          INSTANCE_ID: ${{ steps.host.outputs.INSTANCE_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [ "$STATUS" = "Online" ]; then
              echo "✅ SSM agent online"
              exit 0
            fi
            echo "Attempt $attempt/36: SSM status=$STATUS"
            sleep 10
          done
          echo "::error::SSM agent did not come online"
          exit 1

      - name: Deploy terminal agent via SSM
        env:
          INSTANCE_ID: ${{ steps.host.outputs.INSTANCE_ID }}
          TERMINAL_AGENT_TOKEN: ${{ secrets.TERMINAL_AGENT_TOKEN }}
          AGENT_HOSTNAME: ${{ secrets.AGENT_HOSTNAME }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy mike-os-x terminal agent" \
            --parameters "commands=[
              \"set -eu\",
              \"export TERMINAL_AGENT_TOKEN='$TERMINAL_AGENT_TOKEN'\",
              \"export AGENT_HOSTNAME='$AGENT_HOSTNAME'\",
              \"if [ ! -d /home/ubuntu/mike-os-x/.git ]; then sudo -u ubuntu git clone https://github.com/$REPO.git /home/ubuntu/mike-os-x; fi\",
              \"cd /home/ubuntu/mike-os-x\",
              \"sudo -u ubuntu git fetch origin main\",
              \"sudo -u ubuntu git checkout main\",
              \"sudo -u ubuntu git pull origin main\",
              \"cd /home/ubuntu/mike-os-x/apps/api\",
              \"printf '%s\\\\n' '{\\\"hosts\\\": [\\\"unix:///var/run/docker.sock\\\"]}' | sudo tee /etc/docker/daemon.json >/dev/null\",
              \"sudo systemctl restart docker\",
              \"sleep 3\",
              \"sudo -E docker-compose -f docker-compose.agent.yml build\",
              \"sudo -E docker-compose -f docker-compose.agent.yml up -d\",
              \"sleep 5\",
              \"docker ps | grep -q terminal-shared\",
              \"docker ps | grep -q terminal-agent\",
              \"docker ps | grep -q terminal-agent-caddy\",
              \"timeout 60 sh -c 'until curl -fsS http://127.0.0.1:8001/health; do sleep 2; done'\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"
          STATUS="Pending"
          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              *)
                echo "Attempt $attempt/180: SSM deploy status=$STATUS"
                sleep 5
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy failed with status $STATUS"
            exit 1
          fi

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | bash
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Configure Railway API Service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          AGENT_URL: ${{ steps.host.outputs.AGENT_URL }}
        run: |
          set -euo pipefail
          DOLLAR='$'
          OPEN='{{'
          CLOSE='}}'
          REDIS_REF="${DOLLAR}${OPEN}Redis.REDIS_URL${CLOSE}"

          railway variables \
            --service @mike-os-x/api \
            --set "ENVIRONMENT=production" \
            --set "TERMINAL_AGENT_URL=$AGENT_URL" \
            --set "TERMINAL_AGENT_TOKEN=${{ secrets.TERMINAL_AGENT_TOKEN }}" \
            --set "REDIS_URL=$REDIS_REF" \
            --set "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
            --set "ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}" \
            --set "DOCKER_TLS_VERIFY=0"

          echo "✅ Railway API configured for terminal agent"

      - name: Configure Railway Web Service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variables \
            --service @mike-os-x/web \
            --set "VITE_API_URL=https://api.os.mikemoschitto.com"
          echo "✅ Railway web service configured"

      - name: Verify agent HTTPS
        env:
          AGENT_URL: ${{ steps.host.outputs.AGENT_URL }}
        run: |
          set -euo pipefail
          if curl -fsS --retry 5 --retry-delay 5 "$AGENT_URL/health" >/dev/null; then
            echo "✅ Agent HTTPS health check passed"
          else
            echo "::warning::Public HTTPS health check failed. Confirm DNS for AGENT_HOSTNAME points at the Elastic IP and wait for Caddy certificate issuance."
          fi

      - name: Summary
        env:
          EC2_IP: ${{ steps.host.outputs.EC2_IP }}
          AGENT_URL: ${{ steps.host.outputs.AGENT_URL }}
          INSTANCE_ID: ${{ steps.host.outputs.INSTANCE_ID }}
        run: |
          {
            echo "## Infrastructure Deployment Complete"
            echo ""
            echo "**EC2 IP:** \`$EC2_IP\`"
            echo "**Instance:** \`$INSTANCE_ID\`"
            echo "**Terminal agent:** \`$AGENT_URL\`"
            echo ""
            echo "### Security"
            echo ""
            echo "- Docker daemon stays on the local Unix socket"
            echo "- Public ingress limited to HTTPS/HTTP for the authenticated agent"
            echo "- SSH ingress removed; deploy through AWS SSM"
            echo "- Railway API uses TERMINAL_AGENT_URL instead of Docker TLS"
            echo ""
            echo "Terminal UI remains at https://os.mikemoschitto.com"
          } >> "$GITHUB_STEP_SUMMARY"
